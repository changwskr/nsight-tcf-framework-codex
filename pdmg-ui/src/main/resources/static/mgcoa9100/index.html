<!DOCTYPE html>
<html lang="ko" data-program-id="mgcoa9100" data-default-transaction-id="mgcoa9100S0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDMG 런타임 진단 (mgcoa9100)</title>
  <script src="/_shared/ui-context.js"></script>
  <link rel="stylesheet" href="/_shared/online.css">
</head>
<body class="pdmg-page">
<script>
(function(){
  if (window.self === window.top) return;
  document.documentElement.classList.add("pdmg-embed");
  document.addEventListener("click", function(e){
    var a = e.target.closest('a[href*="index.html#/"]');
    if (!a) return;
    e.preventDefault();
    var href = a.getAttribute("href") || "";
    var i = href.indexOf("#");
    if (i >= 0) window.parent.location.hash = href.slice(i);
  });
})();
</script>
  <div class="tcf-main">
    <header class="tcf-topbar">
      <div class="tcf-topbar__brand">
        <h1>mgcoa9100 · 런타임 진단</h1>
        <p>pdmg-service JVM/Thread/DB Pool 스냅샷 조회. includeDetails=Y 시 활성 거래 포함.</p>
      </div>
      <nav class="tcf-topbar__nav" aria-label="화면 이동">
        <a class="tcf-topbar__link" href="/index.html#/home">홈</a>
        <a class="tcf-topbar__link tcf-topbar__link--active" href="/index.html#/mgcoa9100">전문 테스트</a>
        <a class="tcf-topbar__link" href="/index.html#/rtdiag">진단 가이드</a>
      </nav>
    </header>

    <section class="toolbar">
      <div class="field field-wide">
        <label for="targetBaseUrl">pdmg-service URL</label>
        <input id="targetBaseUrl" type="text" value="http://localhost:8080">
      </div>
      <div class="field field-wide">
        <label for="transactionId">거래</label>
        <select id="transactionId"></select>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="reloadSampleBtn" type="button">샘플 불러오기</button>
        <button class="btn-secondary" id="refreshGuidBtn" type="button">GUID 재채번</button>
        <button class="btn-primary" id="sendBtn" type="button">전문 전송</button>
      </div>
    </section>

    <section class="meta">
      <div class="meta-card">
        <div class="label">거래명</div>
        <div class="value" id="metaName">-</div>
      </div>
      <div class="meta-card">
        <div class="label">엔드포인트</div>
        <div class="value" id="metaEndpoint">-</div>
      </div>
      <div class="meta-card">
        <div class="label">요청 URL</div>
        <div class="value" id="metaTargetUrl">-</div>
      </div>
      <div class="meta-card">
        <div class="label">설명</div>
        <div class="value" id="metaDescription">-</div>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head"><h2>요청 전문 (hdr_nhnis.sys_comm + dto)</h2></div>
        <textarea id="requestBody" spellcheck="false" placeholder='{"hdr_nhnis":{"sys_comm":{...}},"dto":{...}}'></textarea>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>응답 전문 (성공 dto / 실패 result)</h2></div>
        <div class="response-meta" id="responseMeta">
          <span class="empty">아직 요청하지 않았습니다.</span>
        </div>
        <textarea id="responseBody" readonly spellcheck="false"></textarea>
      </article>
    </section>
  </div>
  <script src="/_shared/error-codes.js"></script>
  <script src="/_shared/error-popup.js"></script>
  <script src="/_shared/service-client.js"></script>
  <script src="/_shared/online-single.js"></script>
</body>
</html>
