<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래 파라미터 관리</title>
  <script src="/_shared/ui-context.js"></script>
  <link rel="stylesheet" href="/_shared/online.css">
</head>
<body class="pdmg-page">
  <div class="tcf-main tcf-main--wide">
    <header class="tcf-topbar">
      <div class="tcf-topbar__brand">
        <h1>거래 파라미터 관리 · mgcoa9000</h1>
        <p>TB_MG_TX_PARAM 조회·등록·수정·삭제. 거래명·ID·앱·경로·HTTP 메소드를 관리합니다.</p>
      </div>
      <nav class="tcf-topbar__nav" aria-label="화면 이동">
        <a class="tcf-topbar__link" href="/index.html">홈</a>
        <a class="tcf-topbar__link" href="/mgcoa9000/index.html">전문 테스트</a>
        <a class="tcf-topbar__link tcf-topbar__link--active" href="/txparam/index.html">관리 화면</a>
        <span class="badge" id="targetInfo">대상 확인 중...</span>
      </nav>
    </header>

    <section class="tcf-section">
      <div class="tcf-section__head">
        <h2>검색 / 등록</h2>
        <p>키워드로 검색하고, 추가 버튼으로 신규 거래를 등록합니다.</p>
      </div>

      <section class="toolbar txparam-toolbar">
        <div class="field field-wide">
          <label for="targetBaseUrl">pdmg-service URL</label>
          <input id="targetBaseUrl" type="text" value="http://localhost:8080">
        </div>
        <div class="field field-wide search-field">
          <label for="keyword">검색</label>
          <div class="search-row">
            <input id="keyword" type="text" placeholder="검색" autocomplete="off">
            <button class="btn-icon" id="searchBtn" type="button" title="조회">⌕</button>
            <button class="btn-icon" id="refreshBtn" type="button" title="새로고침">↻</button>
          </div>
        </div>
        <div class="field">
          <label for="pageSize">페이지 크기</label>
          <select id="pageSize">
            <option value="10" selected>10 개씩</option>
            <option value="20">20 개씩</option>
            <option value="50">50 개씩</option>
          </select>
        </div>
        <div class="actions">
          <button class="btn-primary" id="addBtn" type="button">추가</button>
        </div>
      </section>
    </section>

    <section class="response-meta" id="resultMeta">
      <span class="empty">검색 후 결과가 표시됩니다.</span>
    </section>

    <section class="panel table-panel">
      <div class="panel-head">
        <h2>거래 파라미터</h2>
        <span id="resultCount" class="group-tag">0건</span>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="resultTable">
          <thead>
            <tr>
              <th>거래 명</th>
              <th>거래 ID</th>
              <th>어플리케이션</th>
              <th>경로 URL</th>
              <th>HTTP 메소드 명</th>
              <th>등록 사용자 ID</th>
              <th>등록 일시</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr><td colspan="8" class="empty">데이터 없음</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pager" id="pager">
        <button class="btn-secondary" id="prevPageBtn" type="button" disabled>이전</button>
        <span id="pageInfo">1 / 1</span>
        <button class="btn-secondary" id="nextPageBtn" type="button" disabled>다음</button>
      </div>
    </section>
  </div>

  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="panel-head">
        <h2 id="editTitle">거래 파라미터 추가</h2>
        <button class="btn-secondary" type="button" data-close="true">닫기</button>
      </div>
      <div class="modal-body form-grid">
        <div class="field">
          <label for="formTxName">거래 명</label>
          <input id="formTxName" type="text" maxlength="200">
        </div>
        <div class="field">
          <label for="formTxId">거래 ID</label>
          <input id="formTxId" type="text" maxlength="100">
        </div>
        <div class="field">
          <label for="formAppId">어플리케이션</label>
          <input id="formAppId" type="text" maxlength="100" value="pdmg-service">
        </div>
        <div class="field">
          <label for="formPathUrl">경로 URL</label>
          <input id="formPathUrl" type="text" maxlength="300" placeholder="/example">
        </div>
        <div class="field">
          <label for="formHttpMethod">HTTP 메소드</label>
          <select id="formHttpMethod">
            <option value="POST" selected>POST</option>
            <option value="GET">GET</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
            <option value="PATCH">PATCH</option>
          </select>
        </div>
        <div class="field">
          <label for="formUserId">사용자 ID</label>
          <input id="formUserId" type="text" maxlength="50" value="sysadmin">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" id="saveBtn" type="button">저장</button>
      </div>
    </div>
  </div>

  <script src="/_shared/error-codes.js"></script>
  <script src="/_shared/error-popup.js"></script>
  <script src="/_shared/service-client.js"></script>
  <script src="/txparam/txparam.js"></script>
</body>
</html>
