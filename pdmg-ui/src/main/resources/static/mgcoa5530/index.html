<!DOCTYPE html>
<html lang="ko" data-program-id="mgcoa5530" data-default-transaction-id="mgcoa5530S0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDMG 전문 테스트 (mgcoa5530)</title>
  <script src="/_shared/ui-context.js"></script>
  <link rel="stylesheet" href="/_shared/online.css">
</head>
<body class="pdmg-page">
  <div class="tcf-main">
    <header class="tcf-topbar">
      <div class="tcf-topbar__brand">
        <h1>mgcoa5530 · 마케팅희망고객</h1>
        <p>hdr_nhnis + dto 전문을 브라우저에서 pdmg-service로 직접 전송합니다. TCF ON이면 Handler → Facade → Service 경로입니다.</p>
      </div>
      <nav class="tcf-topbar__nav" aria-label="화면 이동">
        <a class="tcf-topbar__link" href="/index.html">홈</a>
        <a class="tcf-topbar__link tcf-topbar__link--active" href="/mgcoa5530/index.html">mgcoa5530</a>
        <a class="tcf-topbar__link" href="/mgcoa8888/index.html">mgcoa8888</a>
        <a class="tcf-topbar__link" href="/mgcoa9999/index.html">mgcoa9999</a>
        <a class="tcf-topbar__link" href="/imagelog/index.html">이미지로그</a>
      </nav>
    </header>

    <section class="toolbar">
      <div class="field field-wide">
        <label for="targetBaseUrl">pdmg-service URL</label>
        <input id="targetBaseUrl" type="text" value="http://localhost:8080">
      </div>
      <div class="field field-wide">
        <label for="transactionId">거래</label>
        <select id="transactionId"></select>
      </div>
      <div id="pageFields" class="field-grid">
        <div class="field field-half">
          <label for="pageNo">페이지 번호</label>
          <input id="pageNo" type="number" min="1" value="1">
        </div>
        <div class="field field-half">
          <label for="pageSize">페이지 크기</label>
          <input id="pageSize" type="number" min="1" value="20">
        </div>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="reloadSampleBtn" type="button">샘플 불러오기</button>
        <button class="btn-secondary" id="refreshGuidBtn" type="button">GUID 재채번</button>
        <button class="btn-primary" id="sendBtn" type="button">거래 요청</button>
      </div>
    </section>

    <section class="meta">
      <div class="meta-card">
        <div class="label">거래명</div>
        <div class="value" id="metaName">-</div>
      </div>
      <div class="meta-card">
        <div class="label">엔드포인트</div>
        <div class="value" id="metaEndpoint">-</div>
      </div>
      <div class="meta-card">
        <div class="label">요청 URL</div>
        <div class="value" id="metaTargetUrl">-</div>
      </div>
      <div class="meta-card">
        <div class="label">설명</div>
        <div class="value" id="metaDescription">-</div>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head"><h2>요청 전문 (hdr_nhnis.sys_comm + dto)</h2></div>
        <textarea id="requestBody" spellcheck="false" placeholder='{"hdr_nhnis":{"sys_comm":{...}},"dto":{...}}'></textarea>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>응답 전문 (hdr_nhnis + dto)</h2></div>
        <div class="response-meta" id="responseMeta">
          <span class="empty">아직 요청하지 않았습니다.</span>
        </div>
        <textarea id="responseBody" readonly spellcheck="false"></textarea>
      </article>
    </section>
  </div>
  <script src="/_shared/error-codes.js"></script>
  <script src="/_shared/error-popup.js"></script>
  <script src="/_shared/service-client.js"></script>
  <script src="/_shared/online-single.js"></script>
</body>
</html>
