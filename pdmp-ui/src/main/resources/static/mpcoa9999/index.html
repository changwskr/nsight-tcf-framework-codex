<!DOCTYPE html>
<html lang="ko" data-default-transaction-id="mpcoa9999S0_S0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDMP 전문 테스트 (mpcoa9999)</title>
  <link rel="stylesheet" href="/_shared/online.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PDMP 전문 테스트 (mpcoa9999)</h1>
      <p>거래를 고르고 JSON 전문을 pdmp-service로 전송합니다. 호출은 pdmp-ui 서버가 중계하므로 CORS 설정과 무관합니다.</p>
      <div class="nav-links">
        <a class="nav-link" href="/index.html">← 거래 목록</a>
      </div>
    </header>

    <section class="toolbar">
      <div class="field field-wide">
        <label for="targetBaseUrl">pdmp-service URL</label>
        <input id="targetBaseUrl" type="text" value="http://localhost:8080">
      </div>
      <div class="field field-wide">
        <label for="transactionId">거래</label>
        <select id="transactionId"></select>
      </div>
      <div id="pageFields" class="field-grid">
        <div class="field field-half">
          <label for="pageNo">페이지 번호</label>
          <input id="pageNo" type="number" min="1" value="1">
        </div>
        <div class="field field-half">
          <label for="pageSize">페이지 크기</label>
          <input id="pageSize" type="number" min="1" value="20">
        </div>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="reloadSampleBtn" type="button">샘플 불러오기</button>
        <button class="btn-primary" id="sendBtn" type="button">거래 요청</button>
      </div>
    </section>

    <section class="meta">
      <div class="meta-card">
        <div class="label">거래명</div>
        <div class="value" id="metaName">-</div>
      </div>
      <div class="meta-card">
        <div class="label">엔드포인트</div>
        <div class="value" id="metaEndpoint">-</div>
      </div>
      <div class="meta-card">
        <div class="label">요청 URL</div>
        <div class="value" id="metaTargetUrl">-</div>
      </div>
      <div class="meta-card">
        <div class="label">설명</div>
        <div class="value" id="metaDescription">-</div>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head"><h2>요청 JSON</h2></div>
        <textarea id="requestBody" spellcheck="false"></textarea>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>응답 JSON</h2></div>
        <div class="response-meta" id="responseMeta">
          <span class="empty">아직 요청하지 않았습니다.</span>
        </div>
        <textarea id="responseBody" readonly spellcheck="false"></textarea>
      </article>
    </section>
  </div>
  <script src="/_shared/online-single.js"></script>
</body>
</html>
