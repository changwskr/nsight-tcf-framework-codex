server:
  port: ${NSIGHT_MODEL_STUDIO_PORT:8787}
  address: ${NSIGHT_MODEL_STUDIO_HOST:127.0.0.1}

spring:
  application:
    name: tcf-ai-methodology
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${NSIGHT_MODEL_STUDIO_DB_URL:jdbc:h2:file:${user.home}/nsight-model-studio/models-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${NSIGHT_MODEL_STUDIO_DB_USER:sa}
    password: ${NSIGHT_MODEL_STUDIO_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  h2:
    console:
      enabled: ${NSIGHT_MODEL_STUDIO_H2_CONSOLE:true}
      path: /h2-console

nsight:
  model-studio:
    version: 0.2.0
    # 레거시 JSON (DB 비어 있을 때 1회 이관)
    data-file: ${NSIGHT_MODEL_STUDIO_DATA:}
    sample-resource: classpath:data/sample_model.json
    seed-resource: classpath:data/models-seed.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.nh.nsight.aimethodology: INFO
