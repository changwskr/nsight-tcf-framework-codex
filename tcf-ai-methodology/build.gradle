// NSIGHT AI Methodology — Model Studio (Spring Boot)
// bootRun: gradle :tcf-ai-methodology:bootRun  (포트 8787)
plugins {
    id 'org.springframework.boot'
    id 'war'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.h2database:h2'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// IDE Run 문제 진단용: runtime classpath에 spring-data-jpa 포함 여부 확인
tasks.register('writeIdeClasspath') {
    group = 'ide'
    doLast {
        def out = file("${buildDir}/ide-runtime.classpath")
        out.parentFile.mkdirs()
        out.text = sourceSets.main.runtimeClasspath.asPath
        def hasJpa = sourceSets.main.runtimeClasspath.files.any { it.name.contains('spring-data-jpa') }
        logger.lifecycle("IDE classpath entries=${sourceSets.main.runtimeClasspath.files.size()}, hasJpa=${hasJpa}")
        if (!hasJpa) {
            throw new GradleException('spring-data-jpa missing from runtimeClasspath')
        }
    }
}

bootJar {
    archiveFileName = 'tcf-ai-methodology.jar'
}

bootWar {
    archiveFileName = 'tcf-ai-methodology.war'
}

war {
    archiveFileName = 'tcf-ai-methodology.war'
}
