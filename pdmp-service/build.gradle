plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'nhnis.mp'
version = '0.0.1-SNAPSHOT'

bootWar {
    enabled = false
}

war {
    enabled = true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

/*
 * 사내(농협상호금융) 원본 설정 - 폐쇄망에서는 아래 블록을 되살리고
 * 그 아래 로컬 개발용 repositories 블록을 주석 처리한다.
 *
 * repositories {
 *     maven {
 *         url = uri("http://19.88.120.152:9010/repository/maven-releases/")
 *         allowInsecureProtocol = true
 *     }
 * }
 */

/* 로컬 개발 PC용 - 사내 넥서스에 접근할 수 없는 환경 */
repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.security:spring-security-web:6.5.7'
    implementation 'org.springframework.security:spring-security-config:6.5.7'
    implementation 'org.springframework.boot:spring-boot-starter-security:3.5.10'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.5.14'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.5.14'
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.5.14'

    /* Log4j2 */
    implementation 'org.springframework.boot:spring-boot-starter-log4j2:3.5.10'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.5.2'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'com.google.code.gson:gson:2.10.1'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test:6.5.7'

    /*
     * 사내(농협상호금융) 원본 설정 - 폐쇄망 Oracle 접속용.
     * 아래 H2 의존성을 주석 처리하고 이 두 줄을 되살린다.
     *
     * implementation 'com.oracle.database.jdbc:ojdbc11:23.3.0.23.09'
     * implementation 'com.oracle.ojdbc:orai18n:19.3.0.0'
     */

    /* 로컬 개발 PC용 - H2 인메모리 DB */
    runtimeOnly 'com.h2database:h2:2.3.232'

    /* JWT Session */
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'

    /* ETC */
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    configureEach {
        exclude group: 'io.netty', module: 'netty-resolver-dns-native-macos'
        exclude group: 'io.netty', module: 'netty-transport-native-epoll'
        exclude group: 'io.netty', module: 'netty-transport-native-kqueue'
    }
}

/* 소스에 한글 주석이 있어 플랫폼 기본 인코딩(CP949)으로는 컴파일되지 않는다. */
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

