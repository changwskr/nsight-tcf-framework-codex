<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AV 샘플 목록</title>
  <link rel="stylesheet" href="/_shared/online.css">
  <link rel="stylesheet" href="/_shared/eb-admin.css">
</head>
<body>
  <div class="eb-admin-wrap">
    <header>
      <h1>AV 샘플 목록</h1>
      <p>AV 업무 샘플 데이터 목록 조회 · <code>AV.Sample.inquiry</code> 거래로 페이징 조회합니다.</p>
      <div class="nav-links">
        <a class="nav-link" href="/index.html">← 업무 목록</a>
      </div>
    </header>

    <section class="eb-meta-bar">
      <div class="eb-meta-card">
        <div class="label">연결 대상</div>
        <div class="value" id="metaTargetUrl">-</div>
      </div>
      <div class="eb-meta-card">
        <div class="label">조회 거래</div>
        <div class="value">AV.Sample.inquiry (AV-INQ-0001)</div>
      </div>
    </section>

    <section class="eb-filter-bar">
      <div class="field">
        <label for="filterSampleKey">샘플 키</label>
        <input id="filterSampleKey" type="text" placeholder="부분 일치">
      </div>
      <div class="field">
        <label for="filterSampleName">샘플명</label>
        <input id="filterSampleName" type="text" placeholder="부분 일치">
      </div>
      <div class="field">
        <label for="filterUseYn">사용 여부</label>
        <select id="filterUseYn">
          <option value="">전체</option>
          <option value="Y">사용(Y)</option>
          <option value="N">미사용(N)</option>
        </select>
      </div>
      <div class="eb-actions">
        <button type="button" class="btn-primary" id="btnSearch">조회</button>
        <button type="button" class="btn-secondary" id="btnClearFilter">필터 초기화</button>
      </div>
    </section>

    <section class="eb-table-panel">
      <h2>샘플 목록</h2>
      <div class="eb-table-wrap">
        <table class="eb-table">
          <thead>
            <tr>
              <th>샘플 키</th>
              <th>샘플명</th>
              <th>사용 여부</th>
              <th>등록일시</th>
            </tr>
          </thead>
          <tbody id="sampleTableBody">
            <tr><td colspan="4" class="eb-empty">조회 중...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="pagination" class="eb-pagination" hidden></div>
    </section>
  </div>

  <script src="/_shared/ui-context.js"></script>
  <script src="/_shared/av-admin.js"></script>
  <script>
    const PAGE_SIZE = 15;
    let pageNo = 1;

    function readFilters() {
      const v = id => document.getElementById(id).value.trim();
      const filters = { pageNo, pageSize: PAGE_SIZE };
      if (v('filterSampleKey')) filters.sampleKey = v('filterSampleKey');
      if (v('filterSampleName')) filters.sampleName = v('filterSampleName');
      if (v('filterUseYn')) filters.useYn = v('filterUseYn');
      return filters;
    }

    function renderRows(rows) {
      const tbody = document.getElementById('sampleTableBody');
      if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="eb-empty">조회된 샘플이 없습니다.</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(row => {
        const sampleKey = AvAdmin.field(row, 'sampleKey');
        const sampleName = AvAdmin.field(row, 'sampleName');
        const useYn = AvAdmin.field(row, 'useYn');
        const createdAt = AvAdmin.formatTs(AvAdmin.field(row, 'createdAt'));
        return `
          <tr>
            <td><strong>${sampleKey}</strong></td>
            <td>${sampleName}</td>
            <td>${AvAdmin.chipForUseYn(useYn)}</td>
            <td>${createdAt}</td>
          </tr>`;
      }).join('');
    }

    async function loadSamples(nextPage) {
      if (nextPage != null) pageNo = nextPage;
      const tbody = document.getElementById('sampleTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="eb-empty">조회 중...</td></tr>';
      try {
        const { body } = await AvAdmin.inquiry('sampleInquiry', readFilters());
        renderRows(body.rows || []);
        AvAdmin.renderPagination(
          document.getElementById('pagination'),
          body.pageNo || pageNo,
          body.pageSize || PAGE_SIZE,
          body.totalCount || 0,
          loadSamples
        );
      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="4" class="eb-empty">${error.message || '조회 실패'}</td></tr>`;
        document.getElementById('pagination').hidden = true;
      }
    }

    function clearFilter() {
      document.getElementById('filterSampleKey').value = '';
      document.getElementById('filterSampleName').value = '';
      document.getElementById('filterUseYn').value = '';
      pageNo = 1;
      loadSamples(1);
    }

    document.getElementById('btnSearch').addEventListener('click', () => loadSamples(1));
    document.getElementById('btnClearFilter').addEventListener('click', clearFilter);
    ['filterSampleKey', 'filterSampleName'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') loadSamples(1);
      });
    });

    AvAdmin.loadConfig()
      .then(() => {
        document.getElementById('metaTargetUrl').textContent = AvAdmin.getTargetUrl();
        return loadSamples(1);
      })
      .catch(error => {
        alert('화면 초기화 실패: ' + error.message);
      });
  </script>
</body>
</html>
