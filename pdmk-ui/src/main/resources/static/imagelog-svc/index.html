<!DOCTYPE html>
<html lang="ko"
      data-program-id="mkcoa8888"
      data-default-base-url="http://localhost:8080"
      data-list-api="/api/imagelog-svc/list"
      data-delete-api="/api/imagelog-svc/delete"
      data-target-label="pdmk-service">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDMK-Service 이미지로그 관리 (mkcoa8888)</title>
  <link rel="stylesheet" href="/_shared/online.css">
  <style>
    .time-window {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .time-chip {
      border: 1px solid var(--border, #334155);
      background: transparent;
      color: inherit;
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
    }
    .time-chip:hover { border-color: var(--accent, #38bdf8); }
    .time-chip.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent, #38bdf8);
      color: var(--accent, #38bdf8);
    }
    .time-window-hint {
      width: 100%;
      font-size: 0.8rem;
      opacity: 0.75;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap wrap-wide">
    <header>
      <h1>Service 이미지로그 관리 (mkcoa8888)</h1>
      <p>pdmk-service TB_FW_IMAGE_LOG. 현재시각 기준 N초 전 구간으로 문제 거래를 추적합니다.</p>
      <div class="nav-links">
        <a class="nav-link" href="/index.html">← 거래 목록</a>
        <a class="nav-link" href="/mkcoa8888/index.html">전문 테스트 →</a>
        <a class="nav-link" href="/imagelog/index.html">OM(7777) 관리 →</a>
        <span class="nav-link" id="targetInfo">대상 확인 중...</span>
      </div>
    </header>

    <section class="toolbar">
      <div class="field field-wide">
        <label for="targetBaseUrl">대상 URL (pdmk-service)</label>
        <input id="targetBaseUrl" type="text" value="http://localhost:8080">
      </div>

      <div class="field field-wide">
        <label>최근 구간 (현재시각 기준)</label>
        <div class="time-window" id="withinSecondsGroup" role="group" aria-label="최근 초 단위 조회">
          <button type="button" class="time-chip" data-seconds="">전체</button>
          <button type="button" class="time-chip" data-seconds="5">5초 전</button>
          <button type="button" class="time-chip" data-seconds="10">10초 전</button>
          <button type="button" class="time-chip" data-seconds="15">15초 전</button>
          <button type="button" class="time-chip" data-seconds="30">30초 전</button>
          <button type="button" class="time-chip" data-seconds="60">1분 전</button>
          <button type="button" class="time-chip" data-seconds="300">5분 전</button>
        </div>
        <p class="time-window-hint" id="withinHint">시간창 미적용 · 전체 기간</p>
        <input id="withinSeconds" type="hidden" value="">
      </div>

      <div class="field">
        <label for="guid">GUID</label>
        <input id="guid" type="text" placeholder="std_gbl_id 정확 일치">
      </div>
      <div class="field">
        <label for="serviceId">서비스 ID</label>
        <input id="serviceId" type="text" placeholder="예: mkcoa5530S0">
      </div>
      <div class="field">
        <label for="screenId">화면 ID</label>
        <input id="screenId" type="text" placeholder="예: mkcoa5530">
      </div>
      <div class="field">
        <label for="optrEno">사용자(사번)</label>
        <input id="optrEno" type="text" placeholder="예: E0000001">
      </div>
      <div class="field field-check">
        <label for="exceptionOnly">문제건만</label>
        <label class="check-line">
          <input id="exceptionOnly" type="checkbox">
          <span>예외(EXCEPTION) 있는 건만</span>
        </label>
      </div>
      <div class="field">
        <label for="pageSize">페이지 크기</label>
        <input id="pageSize" type="number" min="1" max="100" value="20">
      </div>
      <div class="actions">
        <button class="btn-secondary" id="resetBtn" type="button">초기화</button>
        <button class="btn-danger" id="deleteBtn" type="button">선택 삭제</button>
        <button class="btn-primary" id="searchBtn" type="button">조회</button>
      </div>
    </section>

    <section class="response-meta" id="resultMeta">
      <span class="empty">최근 구간을 고르고 조회하세요. 문제 추적은 「예외만」과 함께 쓰면 됩니다.</span>
    </section>

    <section class="panel table-panel">
      <div class="panel-head">
        <h2>조회 결과</h2>
        <span id="resultCount" class="group-tag">0건</span>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="resultTable">
          <thead>
            <tr>
              <th class="col-check"><input id="checkAll" type="checkbox" title="전체 선택"></th>
              <th>GUID</th>
              <th>서비스</th>
              <th>화면</th>
              <th>사용자</th>
              <th>IP</th>
              <th>요청시각</th>
              <th>응답시각</th>
              <th>소요</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr><td colspan="10" class="empty">데이터 없음</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pager" id="pager">
        <button class="btn-secondary" id="prevPageBtn" type="button" disabled>이전</button>
        <span id="pageInfo">1 / 1</span>
        <button class="btn-secondary" id="nextPageBtn" type="button" disabled>다음</button>
      </div>
    </section>
  </div>

  <div class="modal" id="detailModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card error-modal-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="panel-head">
        <h2 id="detailTitle">이미지로그 상세</h2>
        <button class="btn-secondary" type="button" data-close="true">닫기</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <script src="/_shared/error-codes.js?v=20260809a"></script>
    <script src="/_shared/error-popup.js?v=20260808e"></script>
  <script src="/imagelog/imagelog.js?v=20260808e"></script>
</body>
</html>
