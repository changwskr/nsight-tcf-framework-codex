<!DOCTYPE html>
<html lang="ko"
      data-program-id="mkcoa6666"
      data-default-transaction-id="mkcoa6666S0"
      data-default-base-url="http://localhost:8081">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDMK-OM 거래통제 (mkcoa6666)</title>
  <link rel="stylesheet" href="/_shared/online.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PDMK-OM 거래통제 전문 (mkcoa6666)</h1>
      <p>
        Service Catalog CRUD(S0/I0/U0/D0) 및 <code>sys_comm</code> 평가(E0).
        운영 UI: <a href="/txcontrol/index.html">/txcontrol</a>
      </p>
      <div class="nav-links">
        <a class="nav-link" href="/index.html">← 거래 목록</a>
        <a class="nav-link" href="/txcontrol/index.html">관리 화면 →</a>
      </div>
    </header>

    <section class="toolbar">
      <div class="field field-wide">
        <label for="targetBaseUrl">pdmk-om URL</label>
        <input id="targetBaseUrl" type="text" value="http://localhost:8081">
      </div>
      <div class="field field-wide">
        <label for="transactionId">거래</label>
        <select id="transactionId"></select>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="reloadSampleBtn" type="button">샘플 불러오기</button>
        <button class="btn-secondary" id="refreshGuidBtn" type="button">GUID 재채번</button>
        <button class="btn-primary" id="sendBtn" type="button">전문 전송</button>
      </div>
    </section>

    <section class="meta">
      <div class="meta-card">
        <div class="label">거래명</div>
        <div class="value" id="metaName">-</div>
      </div>
      <div class="meta-card">
        <div class="label">엔드포인트</div>
        <div class="value" id="metaEndpoint">-</div>
      </div>
      <div class="meta-card">
        <div class="label">요청 URL</div>
        <div class="value" id="metaTargetUrl">-</div>
      </div>
      <div class="meta-card">
        <div class="label">설명</div>
        <div class="value" id="metaDescription">-</div>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head"><h2>요청 전문 (hdr_nhnis.sys_comm + dto)</h2></div>
        <textarea id="requestBody" spellcheck="false"></textarea>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>응답 전문</h2></div>
        <div class="response-meta" id="responseMeta">
          <span class="empty">아직 요청하지 않았습니다.</span>
        </div>
        <textarea id="responseBody" readonly spellcheck="false"></textarea>
      </article>
    </section>
  </div>
  <script src="/_shared/error-codes.js?v=20260809a"></script>
    <script src="/_shared/error-popup.js"></script>
  <script src="/_shared/online-single.js"></script>
</body>
</html>
