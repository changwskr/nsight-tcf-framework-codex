<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-310 서버군 · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand">
        <h1>인프라 아키텍처 관리</h1>
        <p>INF-310 서버군</p>
      </div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/systems/index.html">INF-210 시스템</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/groups/index.html">INF-310 서버군</a>
          <a class="infra-menu-link" href="/infra/assets/index.html">INF-320 자산</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina3110* · TB_IF_SERVER_GROUP_PILOT</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div>
          <h1>INF-310 서버군</h1>
          <p>용량·HA 산정 단위인 서버군을 관리합니다. 시스템 FK를 검증합니다.</p>
        </div>
        <span class="badge">scid=INF-310</span>
      </header>
      <section class="toolbar">
        <div class="field field-wide"><label for="keyword">검색</label><input id="keyword" placeholder="Group ID/명/시스템"></div>
        <div class="field"><label for="techRoleCd">역할</label>
          <select id="techRoleCd"><option value="">전체</option><option>WEB</option><option>WAS</option><option>DATABASE</option><option>BATCH</option><option>CACHE</option></select>
        </div>
        <div class="field"><label for="envCd">환경</label>
          <select id="envCd"><option value="">전체</option><option>PROD</option><option>STG</option><option>DEV</option></select>
        </div>
        <div class="field"><label for="pageSize">페이지</label>
          <select id="pageSize"><option value="10" selected>10</option><option value="20">20</option></select>
        </div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="addBtn">신규</button>
        </div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>서버군 목록</h2><span class="group-tag" id="resultCount">0건</span></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Group ID</th><th>서버군명</th><th>시스템</th><th>역할</th><th>환경</th><th>Tier</th>
                <th>Active</th><th>Standby</th><th>DR</th><th>상태</th><th></th>
              </tr>
            </thead>
            <tbody id="resultBody"><tr><td colspan="11" class="empty">데이터 없음</td></tr></tbody>
          </table>
        </div>
        <div class="pager">
          <button class="btn-secondary" type="button" id="prevPageBtn" disabled>이전</button>
          <span id="pageInfo">1 / 1</span>
          <button class="btn-secondary" type="button" id="nextPageBtn" disabled>다음</button>
        </div>
      </section>
    </div>
  </div>
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="editTitle">서버군 등록</h2><button class="btn-secondary" type="button" data-close="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formGroupId">Group ID *</label><input id="formGroupId" maxlength="40"></div>
        <div class="field"><label for="formGroupName">서버군명 *</label><input id="formGroupName" maxlength="120"></div>
        <div class="field"><label for="formSystemId">시스템</label><input id="formSystemId" maxlength="40" placeholder="SYS-ONLINE"></div>
        <div class="field"><label for="formTechRoleCd">역할 *</label>
          <select id="formTechRoleCd"><option>WEB</option><option selected>WAS</option><option>DATABASE</option><option>BATCH</option><option>CACHE</option></select>
        </div>
        <div class="field"><label for="formEnvCd">환경 *</label>
          <select id="formEnvCd"><option>DEV</option><option>STG</option><option selected>PROD</option></select>
        </div>
        <div class="field"><label for="formTierCd">Tier</label>
          <select id="formTierCd"><option>TIER0</option><option selected>TIER1</option><option>TIER2</option><option>TIER3</option></select>
        </div>
        <div class="field"><label for="formActiveNodes">Active</label><input id="formActiveNodes" type="number" min="0" value="1"></div>
        <div class="field"><label for="formStandbyNodes">Standby</label><input id="formStandbyNodes" type="number" min="0" value="0"></div>
        <div class="field"><label for="formDrNodes">DR</label><input id="formDrNodes" type="number" min="0" value="0"></div>
        <div class="field"><label for="formStatusCd">상태</label>
          <select id="formStatusCd"><option>DISCOVERED</option><option>VALIDATING</option><option selected>CONFIRMED</option></select>
        </div>
        <div class="field field-span"><label for="formRemark">비고</label><input id="formRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" type="button" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/groups/groups.js"></script>
</body>
</html>
