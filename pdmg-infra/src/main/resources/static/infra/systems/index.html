<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-210 업무 시스템 · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand">
        <h1>인프라 아키텍처 관리</h1>
        <p>INF-210 업무 시스템</p>
      </div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/systems/index.html">INF-210 시스템</a>
          <a class="infra-menu-link" href="/infra/groups/index.html">INF-310 서버군</a>
          <a class="infra-menu-link" href="/infra/assets/index.html">INF-320 자산</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina2100* · TB_IF_BIZ_SYSTEM_PILOT</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div>
          <h1>INF-210 업무 시스템</h1>
          <p>업무 시스템 마스터 CRUD. 서버군 연결이 있으면 삭제할 수 없습니다.</p>
        </div>
        <span class="badge">scid=INF-210</span>
      </header>
      <section class="toolbar">
        <div class="field field-wide">
          <label for="keyword">검색</label>
          <input id="keyword" type="text" placeholder="시스템ID/명/조직">
        </div>
        <div class="field">
          <label for="statusCd">상태</label>
          <select id="statusCd">
            <option value="">전체</option>
            <option>DISCOVERED</option>
            <option>VALIDATING</option>
            <option>CONFIRMED</option>
            <option>RETIRED</option>
          </select>
        </div>
        <div class="field">
          <label for="pageSize">페이지</label>
          <select id="pageSize"><option value="10" selected>10</option><option value="20">20</option></select>
        </div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="addBtn">신규</button>
        </div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>시스템 목록</h2><span class="group-tag" id="resultCount">0건</span></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>System ID</th><th>시스템명</th><th>담당조직</th><th>상태</th><th>비고</th><th>등록일시</th><th></th>
              </tr>
            </thead>
            <tbody id="resultBody"><tr><td colspan="7" class="empty">데이터 없음</td></tr></tbody>
          </table>
        </div>
        <div class="pager">
          <button class="btn-secondary" type="button" id="prevPageBtn" disabled>이전</button>
          <span id="pageInfo">1 / 1</span>
          <button class="btn-secondary" type="button" id="nextPageBtn" disabled>다음</button>
        </div>
      </section>
    </div>
  </div>
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="editTitle">시스템 등록</h2><button class="btn-secondary" type="button" data-close="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formSystemId">System ID *</label><input id="formSystemId" maxlength="40"></div>
        <div class="field"><label for="formSystemName">시스템명 *</label><input id="formSystemName" maxlength="120"></div>
        <div class="field"><label for="formOwnerOrg">담당조직</label><input id="formOwnerOrg" maxlength="80"></div>
        <div class="field"><label for="formStatusCd">상태</label>
          <select id="formStatusCd"><option>DISCOVERED</option><option>VALIDATING</option><option selected>CONFIRMED</option><option>RETIRED</option></select>
        </div>
        <div class="field field-span"><label for="formRemark">비고</label><input id="formRemark" maxlength="200"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" type="button" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/systems/systems.js"></script>
</body>
</html>
