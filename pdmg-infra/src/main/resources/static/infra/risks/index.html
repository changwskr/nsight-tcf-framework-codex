<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-020 리스크·Gate · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-020 리스크</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/dashboard/index.html">INF-010 대시보드</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/risks/index.html">INF-020 리스크</a>
          <a class="infra-menu-link" href="/infra/eol/index.html">INF-430 EOL</a>
          <a class="infra-menu-link" href="/infra/checklist/index.html">INF-910 Checklist</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina0200S0 · 워크리스트</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-020 리스크·Gate 워크리스트</h1><p>Checklist 미완 · EOL · Gate FAIL/CONDITIONAL 통합.</p></div>
        <button class="btn-secondary" type="button" id="searchBtn">조회</button>
      </header>
      <section class="kpi-grid">
        <article class="kpi-card"><div class="label">Checklist Open</div><div class="value" id="kpiCl">-</div></article>
        <article class="kpi-card"><div class="label">EOL ≤12m</div><div class="value" id="kpiEol">-</div></article>
        <article class="kpi-card"><div class="label">Gate Open</div><div class="value" id="kpiGate">-</div></article>
        <article class="kpi-card"><div class="label">Rows</div><div class="value" id="kpiRows">-</div></article>
      </section>
      <section class="toolbar">
        <div class="field field-wide"><label for="keyword">검색</label><input id="keyword" placeholder="대상/제목"></div>
        <div class="field"><label for="severityCd">Severity</label><select id="severityCd"><option value="">전체</option><option>P0</option><option>P1</option><option>P2</option></select></div>
        <div class="field"><label for="riskType">유형</label><select id="riskType"><option value="ALL">전체</option><option>CHECKLIST</option><option>EOL</option><option>GATE</option></select></div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>조치 큐</h2><span class="group-tag" id="resultCount">0건</span></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Sev</th><th>유형</th><th>대상</th><th>내용</th><th>Gate</th><th>비고</th></tr></thead>
            <tbody id="resultBody"><tr><td colspan="6" class="empty">데이터 없음</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/risks/risks.js"></script>
</body>
</html>
