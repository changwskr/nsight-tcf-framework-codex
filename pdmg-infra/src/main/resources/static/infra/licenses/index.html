<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-710 라이선스 · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-710 License</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/licenses/index.html">INF-710 라이선스</a>
          <a class="infra-menu-link" href="/infra/license-alloc/index.html">INF-720 할당</a>
          <a class="infra-menu-link" href="/infra/tco/index.html">INF-730 TCO</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina7100* · Soft 만료경고</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-710 라이선스 관리</h1><p>계약·할당량. 180일 이내 Soft 경고.</p></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="addBtn">등록</button>
        </div>
      </header>
      <section class="toolbar">
        <div class="field field-wide"><label for="keyword">키워드</label><input id="keyword" placeholder="LIC / product / vendor"></div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>Contracts</h2><span class="group-tag" id="warnLine"></span></div>
        <div class="table-wrap"><table class="data-table"><thead>
          <tr><th>ID</th><th>Product</th><th>Vendor</th><th>Model</th><th>Qty</th><th>할당</th><th>만료</th><th></th></tr>
        </thead><tbody id="rowBody"><tr><td colspan="8" class="empty">-</td></tr></tbody></table></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Allocations</h2><span class="group-tag" id="allocTitle">선택 시 표시</span></div>
        <div class="table-wrap"><table class="data-table"><thead>
          <tr><th>Asset</th><th>License</th><th>Qty</th></tr>
        </thead><tbody id="allocBody"><tr><td colspan="3" class="empty">-</td></tr></tbody></table></div>
      </section>
    </div>
  </div>
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="modalTitle">라이선스 등록</h2><button class="btn-secondary" type="button" data-close="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formId">License ID *</label><input id="formId"></div>
        <div class="field"><label for="formProduct">Product *</label><input id="formProduct"></div>
        <div class="field"><label for="formVendor">Vendor</label><input id="formVendor"></div>
        <div class="field"><label for="formModel">Model</label><select id="formModel"><option>CORE</option><option>PROCESSOR</option><option>SUBSCRIPTION</option><option>NAMED_USER</option></select></div>
        <div class="field"><label for="formQty">Qty</label><input id="formQty" type="number" step="0.01"></div>
        <div class="field"><label for="formMaint">Annual Maint</label><input id="formMaint" type="number" step="0.01"></div>
        <div class="field"><label for="formEnd">Contract End</label><input id="formEnd" placeholder="yyyy-MM-dd"></div>
        <div class="field"><label for="formMobility">Mobility</label><select id="formMobility"><option>N</option><option>Y</option></select></div>
        <div class="field field-span"><label for="formRemark">비고</label><input id="formRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" type="button" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/licenses/licenses.js"></script>
</body>
</html>
