<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-150 조직·담당자 · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-150 조직·담당자</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/codes/index.html">INF-110 분류코드</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/orgs/index.html">INF-150 조직·담당자</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina1500* · entityType ORG|PERSON</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-150 조직·담당자</h1><p>조직 트리와 담당자 목록. 삭제 대신 비활성.</p></div>
        <span class="badge">scid=INF-150</span>
      </header>
      <div style="display:grid;grid-template-columns:280px 1fr;gap:1rem;align-items:start">
        <section class="panel">
          <div class="panel-head"><h2>조직</h2>
            <button class="btn-secondary" type="button" id="addOrgBtn">조직+</button>
          </div>
          <div id="orgList" class="table-wrap" style="max-height:520px;overflow:auto"></div>
        </section>
        <div>
          <section class="toolbar">
            <div class="field field-wide"><label for="keyword">검색</label><input id="keyword" placeholder="사번/이름/이메일"></div>
            <div class="field"><label for="activeYn">활성</label><select id="activeYn"><option value="">전체</option><option value="Y" selected>Y</option><option value="N">N</option></select></div>
            <div class="actions">
              <button class="btn-secondary" type="button" id="searchBtn">조회</button>
              <button class="btn-primary" type="button" id="addPersonBtn">담당자+</button>
            </div>
          </section>
          <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
          <section class="panel">
            <div class="panel-head"><h2>담당자</h2><span class="group-tag" id="resultCount">0건</span></div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>사번</th><th>이름</th><th>조직</th><th>역할</th><th>이메일</th><th>활성</th><th></th></tr></thead>
                <tbody id="resultBody"><tr><td colspan="7" class="empty">데이터 없음</td></tr></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div class="modal" id="orgModal" hidden>
    <div class="modal-backdrop" data-close-org="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="orgTitle">조직 등록</h2><button class="btn-secondary" type="button" data-close-org="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formOrgId">조직 ID *</label><input id="formOrgId"></div>
        <div class="field"><label for="formOrgName">조직명 *</label><input id="formOrgName"></div>
        <div class="field"><label for="formParentOrgId">상위조직</label><input id="formParentOrgId"></div>
        <div class="field"><label for="formOrgTypeCd">유형</label><select id="formOrgTypeCd"><option>OPS</option><option>OWNER</option><option>BOTH</option></select></div>
        <div class="field"><label for="formOrgActiveYn">활성</label><select id="formOrgActiveYn"><option>Y</option><option>N</option></select></div>
        <div class="field field-span"><label for="formOrgRemark">비고</label><input id="formOrgRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close-org="true">취소</button>
        <button class="btn-primary" type="button" id="saveOrgBtn">저장</button>
      </div>
    </div>
  </div>
  <div class="modal" id="personModal" hidden>
    <div class="modal-backdrop" data-close-person="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="personTitle">담당자 등록</h2><button class="btn-secondary" type="button" data-close-person="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formPersonId">사번 *</label><input id="formPersonId"></div>
        <div class="field"><label for="formPersonName">이름 *</label><input id="formPersonName"></div>
        <div class="field"><label for="formPersonOrgId">조직</label><input id="formPersonOrgId"></div>
        <div class="field"><label for="formEmail">이메일</label><input id="formEmail"></div>
        <div class="field"><label for="formRoleCd">RACI 역할</label>
          <select id="formRoleCd"><option>ARCH</option><option>OPS</option><option>SEC</option><option>PMO</option><option>ADMIN</option></select>
        </div>
        <div class="field"><label for="formPersonActiveYn">활성</label><select id="formPersonActiveYn"><option>Y</option><option>N</option></select></div>
        <div class="field field-span"><label for="formPersonRemark">비고</label><input id="formPersonRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close-person="true">취소</button>
        <button class="btn-primary" type="button" id="savePersonBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/orgs/orgs.js"></script>
</body>
</html>
