<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-120 조사 템플릿 · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-120 조사 템플릿</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/codes/index.html">INF-110 분류코드</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/surveys/index.html">INF-120 조사 템플릿</a>
          <a class="infra-menu-link" href="/infra/orgs/index.html">INF-150 조직·담당자</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina1200* · TEMPLATE|ITEM</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-120 조사 템플릿</h1><p>템플릿·항목 관리. INF-330 EAV 확장의 기준.</p></div>
        <span class="badge">scid=INF-120</span>
      </header>
      <div style="display:grid;grid-template-columns:280px 1fr;gap:1rem;align-items:start">
        <section class="panel">
          <div class="panel-head"><h2>템플릿</h2>
            <button class="btn-secondary" type="button" id="addTmplBtn">템플릿+</button>
          </div>
          <div id="tmplList" class="table-wrap" style="max-height:520px;overflow:auto"></div>
        </section>
        <div>
          <section class="toolbar">
            <div class="field field-wide"><label for="keyword">검색</label><input id="keyword" placeholder="항목 ID/명"></div>
            <div class="actions">
              <button class="btn-secondary" type="button" id="searchBtn">조회</button>
              <button class="btn-primary" type="button" id="addItemBtn">항목+</button>
            </div>
          </section>
          <section class="response-meta" id="resultMeta">템플릿을 선택하세요.</section>
          <section class="panel">
            <div class="panel-head"><h2 id="itemTitle">조사 항목</h2><span class="group-tag" id="resultCount">0건</span></div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>Item ID</th><th>항목명</th><th>타입</th><th>필수</th><th>정렬</th><th>활성</th><th></th></tr></thead>
                <tbody id="resultBody"><tr><td colspan="7" class="empty">데이터 없음</td></tr></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div class="modal" id="tmplModal" hidden>
    <div class="modal-backdrop" data-close-tmpl="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="tmplTitle">템플릿 등록</h2><button class="btn-secondary" type="button" data-close-tmpl="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formTemplateId">템플릿 ID *</label><input id="formTemplateId"></div>
        <div class="field"><label for="formTemplateName">템플릿명 *</label><input id="formTemplateName"></div>
        <div class="field"><label for="formTechRoleCd">기술역할</label><input id="formTechRoleCd" placeholder="WAS/WEB/DATABASE"></div>
        <div class="field"><label for="formTmplActiveYn">활성</label><select id="formTmplActiveYn"><option>Y</option><option>N</option></select></div>
        <div class="field field-span"><label for="formTmplRemark">비고</label><input id="formTmplRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close-tmpl="true">취소</button>
        <button class="btn-primary" type="button" id="saveTmplBtn">저장</button>
      </div>
    </div>
  </div>
  <div class="modal" id="itemModal" hidden>
    <div class="modal-backdrop" data-close-item="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="itemEditTitle">항목 등록</h2><button class="btn-secondary" type="button" data-close-item="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formItemTemplateId">템플릿 *</label><input id="formItemTemplateId" disabled></div>
        <div class="field"><label for="formItemId">Item ID *</label><input id="formItemId"></div>
        <div class="field"><label for="formItemName">항목명 *</label><input id="formItemName"></div>
        <div class="field"><label for="formItemTypeCd">타입</label><select id="formItemTypeCd"><option>TEXT</option><option>TEXTAREA</option><option>NUMBER</option><option>YN</option><option>CODE</option></select></div>
        <div class="field"><label for="formRequiredYn">필수</label><select id="formRequiredYn"><option>N</option><option>Y</option></select></div>
        <div class="field"><label for="formSortNo">정렬</label><input id="formSortNo" type="number" value="0"></div>
        <div class="field"><label for="formItemActiveYn">활성</label><select id="formItemActiveYn"><option>Y</option><option>N</option></select></div>
        <div class="field field-span"><label for="formItemRemark">비고</label><input id="formItemRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close-item="true">취소</button>
        <button class="btn-primary" type="button" id="saveItemBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/surveys/surveys.js"></script>
</body>
</html>
