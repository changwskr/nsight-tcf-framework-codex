<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-610 HA·DR · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-610 HA/DR</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/groups/index.html">INF-310 서버군</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/ha/index.html">INF-610 HA/DR</a>
          <a class="infra-menu-link" href="/infra/gates/index.html">INF-920 Gate</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina6100* · RL-AV Soft on save</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-610 HA·DR 프로파일</h1><p>저장은 Soft 경고. Gate5 PASS 시 HARD.</p></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="saveBtn">저장</button>
        </div>
      </header>
      <section class="toolbar">
        <div class="field"><label for="targetTypeCd">대상유형</label><select id="targetTypeCd"><option>GROUP</option><option>ASSET</option><option>SYSTEM</option></select></div>
        <div class="field field-wide"><label for="targetId">대상ID</label><input id="targetId" value="SG-WAS-A"></div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>프로파일</h2><span class="group-tag" id="warnLine"></span></div>
        <div class="modal-body" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem">
          <div class="field"><label for="opsHoursCd">운영시간</label><select id="opsHoursCd"><option>24X365</option><option>BUSINESS_HOURS</option><option>BATCH_WINDOW</option></select></div>
          <div class="field"><label for="haYn">HA</label><select id="haYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="haModeCd">HA Mode</label><input id="haModeCd" placeholder="ACTIVE_ACTIVE"></div>
          <div class="field"><label for="clusterYn">Cluster</label><select id="clusterYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="drYn">DR</label><select id="drYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="drModeCd">DR Mode</label><input id="drModeCd" placeholder="WARM"></div>
          <div class="field"><label for="rtoMinutes">RTO(분)</label><input id="rtoMinutes" type="number"></div>
          <div class="field"><label for="rpoMinutes">RPO(분)</label><input id="rpoMinutes" type="number"></div>
          <div class="field"><label for="backupYn">Backup</label><select id="backupYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="monitoringYn">Monitoring</label><select id="monitoringYn"><option>N</option><option>Y</option></select></div>
          <div class="field field-span" style="grid-column:1/-1"><label for="remark">비고</label><input id="remark"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/ha/ha.js"></script>
</body>
</html>
