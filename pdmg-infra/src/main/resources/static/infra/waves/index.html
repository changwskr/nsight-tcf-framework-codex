<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-820 Wave · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-820 Wave</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/migration/index.html">INF-810 7R</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/waves/index.html">INF-820 Wave</a>
          <a class="infra-menu-link" href="/infra/gates/index.html">INF-920 Gate</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina8200* · RL-MG-004 Soft</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-820 Migration Wave</h1><p>Critical 의존의 Wave 충돌 Soft 경고.</p></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="saveBtn">저장</button>
        </div>
      </header>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>Waves</h2><span class="group-tag" id="warnLine"></span></div>
        <div class="table-wrap"><table class="data-table"><thead>
          <tr><th>Seq</th><th>Wave</th><th>Name</th><th>Start</th><th>End</th><th>Status</th><th>Plans</th><th>Remark</th></tr>
        </thead><tbody id="rowBody"><tr><td colspan="8" class="empty">-</td></tr></tbody></table></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Wave Upsert</h2></div>
        <div class="modal-body" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem">
          <div class="field"><label for="waveId">Wave ID *</label><input id="waveId" value="W1"></div>
          <div class="field"><label for="waveName">Name *</label><input id="waveName"></div>
          <div class="field"><label for="sequenceNo">Seq</label><input id="sequenceNo" type="number" value="1"></div>
          <div class="field"><label for="statusCd">Status</label><select id="statusCd"><option>PLANNED</option><option>IN_PROGRESS</option><option>DONE</option></select></div>
          <div class="field"><label for="plannedStart">Start</label><input id="plannedStart" placeholder="yyyyMMdd"></div>
          <div class="field"><label for="plannedEnd">End</label><input id="plannedEnd" placeholder="yyyyMMdd"></div>
          <div class="field field-span" style="grid-column:1/-1"><label for="remark">비고</label><input id="remark"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/waves/waves.js"></script>
</body>
</html>
