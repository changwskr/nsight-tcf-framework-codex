<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-810 7R · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-810 7R</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/migration/index.html">INF-810 7R</a>
          <a class="infra-menu-link" href="/infra/waves/index.html">INF-820 Wave</a>
          <a class="infra-menu-link" href="/infra/deps/index.html">INF-530 의존맵</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina8100* · RL-MG-001/002/003</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-810 7R 전환계획</h1><p>목표 플랫폼 HARD · Wave 미배정 Soft.</p></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="addBtn">계획+</button>
        </div>
      </header>
      <section class="toolbar">
        <div class="field"><label for="waveId">Wave</label>
          <select id="waveId"><option value="">전체</option><option>W1</option><option>W2</option><option>W3</option></select>
        </div>
        <div class="field"><label for="strategy7rCd">7R</label>
          <select id="strategy7rCd"><option value="">전체</option><option>REHOST</option><option>REPLATFORM</option><option>REFACTOR</option><option>REPURCHASE</option><option>RETAIN</option><option>RETIRE</option><option>RELOCATE</option></select>
        </div>
        <div class="field field-wide"><label for="keyword">키워드</label><input id="keyword" placeholder="planId / targetId"></div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>Plans</h2><span class="group-tag" id="warnLine"></span></div>
        <div class="table-wrap"><table class="data-table"><thead>
          <tr><th>Plan</th><th>Target</th><th>AS-IS</th><th>7R</th><th>TO-BE</th><th>난이도</th><th>Wave</th><th>상태</th><th></th></tr>
        </thead><tbody id="rowBody"><tr><td colspan="9" class="empty">-</td></tr></tbody></table></div>
      </section>
    </div>
  </div>
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="modalTitle">계획 등록</h2><button class="btn-secondary" type="button" data-close="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formPlanId">Plan ID *</label><input id="formPlanId"></div>
        <div class="field"><label for="formTargetType">Target Type</label><select id="formTargetType"><option>GROUP</option><option>ASSET</option><option>SYSTEM</option><option>DB</option></select></div>
        <div class="field"><label for="formTargetId">Target ID *</label><input id="formTargetId"></div>
        <div class="field"><label for="form7r">7R *</label><select id="form7r"><option>REHOST</option><option>REPLATFORM</option><option>REFACTOR</option><option>REPURCHASE</option><option>RETAIN</option><option>RETIRE</option><option>RELOCATE</option></select></div>
        <div class="field"><label for="formAsis">AS-IS</label><input id="formAsis" placeholder="VM"></div>
        <div class="field"><label for="formTobe">TO-BE *</label><select id="formTobe"><option>IAAS</option><option>PAAS</option><option>SAAS</option><option>K8S</option><option>BARE_METAL</option><option>VM</option></select></div>
        <div class="field"><label for="formDiff">난이도</label><select id="formDiff"><option>L</option><option selected>M</option><option>H</option></select></div>
        <div class="field"><label for="formWave">Wave</label><select id="formWave"><option value="">미배정</option><option>W1</option><option>W2</option><option>W3</option></select></div>
        <div class="field"><label for="formStatus">상태</label><select id="formStatus"><option>TARGET_DEFINED</option><option>PLANNING</option><option>CONFIRMED</option><option>REVIEW</option></select></div>
        <div class="field field-span"><label for="formRemark">비고</label><input id="formRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" type="button" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/migration/migration.js"></script>
</body>
</html>
