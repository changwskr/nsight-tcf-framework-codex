<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-630 보안 · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-630 Security</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/ha/index.html">INF-610 HA/DR</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/security/index.html">INF-630 보안</a>
          <a class="infra-menu-link" href="/infra/gates/index.html">INF-920 Gate</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina6300* · RL-SC Soft</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-630 보안 프로파일</h1><p>개인정보·암호·PAM Soft 경고. Gate5 HARD는 후속.</p></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="saveBtn">저장</button>
        </div>
      </header>
      <section class="toolbar">
        <div class="field"><label for="targetTypeCd">대상유형</label><select id="targetTypeCd"><option>GROUP</option><option>ASSET</option><option>SYSTEM</option><option>DB</option></select></div>
        <div class="field field-wide"><label for="targetId">대상ID</label><input id="targetId" value="SG-WAS-A"></div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>프로파일</h2><span class="group-tag" id="warnLine"></span></div>
        <div class="modal-body" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem">
          <div class="field"><label for="securityGradeCd">Security Grade</label><select id="securityGradeCd"><option>GENERAL</option><option>IMPORTANT</option><option>CRITICAL</option></select></div>
          <div class="field"><label for="authMethodCd">Auth</label><input id="authMethodCd" placeholder="JWT"></div>
          <div class="field"><label for="personalInfoYn">Personal Info</label><select id="personalInfoYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="creditInfoYn">Credit Info</label><select id="creditInfoYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="financialTxnYn">Financial Txn</label><select id="financialTxnYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="adminInfoYn">Admin Info</label><select id="adminInfoYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="externalConnYn">External Conn</label><select id="externalConnYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="internetConnYn">Internet Conn</label><select id="internetConnYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="encryptionYn">Encryption</label><select id="encryptionYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="kmsHsmYn">KMS/HSM</label><select id="kmsHsmYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="pamYn">PAM</label><select id="pamYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="edrYn">EDR</label><select id="edrYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="auditLogYn">Audit Log</label><select id="auditLogYn"><option>N</option><option>Y</option></select></div>
          <div class="field"><label for="networkZoneCd">Network Zone</label><input id="networkZoneCd" placeholder="APP"></div>
          <div class="field field-span" style="grid-column:1/-1"><label for="remark">비고</label><input id="remark"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/security/security.js"></script>
</body>
</html>
