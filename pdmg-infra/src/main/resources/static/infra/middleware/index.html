<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INF-410 Middleware · pdmg-infra</title>
  <link rel="stylesheet" href="/_shared/infra.css">
</head>
<body>
  <div class="infra-shell">
    <aside class="infra-sidebar">
      <div class="infra-sidebar__brand"><h1>인프라 아키텍처 관리</h1><p>INF-410 Middleware</p></div>
      <nav>
        <div class="infra-menu-group">
          <div class="infra-menu-group__label">이동</div>
          <a class="infra-menu-link" href="/index.html">홈</a>
          <a class="infra-menu-link" href="/infra/assets/index.html">INF-320 자산</a>
          <a class="infra-menu-link infra-menu-link--active" href="/infra/middleware/index.html">INF-410 Middleware</a>
          <a class="infra-menu-link" href="/infra/db/index.html">INF-420 DB</a>
          <a class="infra-menu-link" href="/infra/network/index.html">INF-510 Network</a>
        </div>
      </nav>
      <div class="infra-sidebar__foot">ifina4100* · TB_IF_MW_INSTALL_PILOT</div>
    </aside>
    <div class="infra-main">
      <header class="infra-topbar">
        <div><h1>INF-410 Middleware</h1><p>자산 설치 Middleware. assetId FK 필수.</p></div>
        <span class="badge">scid=INF-410</span>
      </header>
      <section class="toolbar">
        <div class="field field-wide"><label for="keyword">검색</label><input id="keyword" placeholder="MW ID/자산/제품"></div>
        <div class="field"><label for="assetId">자산</label><input id="assetId" placeholder="INF-APP-001"></div>
        <div class="field"><label for="pageSize">페이지</label><select id="pageSize"><option value="10" selected>10</option><option value="20">20</option></select></div>
        <div class="actions">
          <button class="btn-secondary" type="button" id="searchBtn">조회</button>
          <button class="btn-primary" type="button" id="addBtn">신규</button>
        </div>
      </section>
      <section class="response-meta" id="resultMeta">조회를 실행하세요.</section>
      <section class="panel">
        <div class="panel-head"><h2>Middleware</h2><span class="group-tag" id="resultCount">0건</span></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>MW ID</th><th>자산</th><th>제품</th><th>버전</th><th>EOL</th><th>상태</th><th></th></tr></thead>
            <tbody id="resultBody"><tr><td colspan="7" class="empty">데이터 없음</td></tr></tbody>
          </table>
        </div>
        <div class="pager">
          <button class="btn-secondary" type="button" id="prevPageBtn" disabled>이전</button>
          <span id="pageInfo">1 / 1</span>
          <button class="btn-secondary" type="button" id="nextPageBtn" disabled>다음</button>
        </div>
      </section>
    </div>
  </div>
  <div class="modal" id="editModal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-card">
      <div class="panel-head"><h2 id="editTitle">Middleware 등록</h2><button class="btn-secondary" type="button" data-close="true">닫기</button></div>
      <div class="modal-body">
        <div class="field"><label for="formMwId">MW ID *</label><input id="formMwId"></div>
        <div class="field"><label for="formAssetId">자산 *</label><input id="formAssetId" value="INF-APP-001"></div>
        <div class="field"><label for="formProductName">제품 *</label><input id="formProductName"></div>
        <div class="field"><label for="formVersionNo">버전</label><input id="formVersionNo"></div>
        <div class="field"><label for="formEolDate">EOL</label><input id="formEolDate" placeholder="YYYY-MM-DD"></div>
        <div class="field"><label for="formStatusCd">상태</label><select id="formStatusCd"><option>DISCOVERED</option><option selected>CONFIRMED</option><option>VALIDATING</option></select></div>
        <div class="field field-span"><label for="formRemark">비고</label><input id="formRemark"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close="true">취소</button>
        <button class="btn-primary" type="button" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <script src="/_shared/infra-api.js"></script>
  <script src="/infra/middleware/middleware.js"></script>
</body>
</html>
